<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Já Verificado - IceX Verify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icex-theme.css') }}">
    <style>
        .verified-card {
            text-align: center;
            padding: 3rem 2rem;
            border-color: rgba(0, 212, 170, 0.4) !important;
        }
        
        .verified-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #00d4aa 0%, #00ff88 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: verifiedPulse 2s ease-in-out infinite;
            box-shadow: 
                0 0 30px rgba(0, 212, 170, 0.5),
                0 0 60px rgba(0, 212, 170, 0.3);
        }
        
        @keyframes verifiedPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 0 30px rgba(0, 212, 170, 0.5),
                    0 0 60px rgba(0, 212, 170, 0.3);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 
                    0 0 40px rgba(0, 212, 170, 0.7),
                    0 0 80px rgba(0, 212, 170, 0.5);
            }
        }
        
        .verified-icon i {
            font-size: 4rem;
            color: #0a0a0f;
        }
        
        .verified-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #00d4aa;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(0, 212, 170, 0.5);
        }
        
        .verified-message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .status-card {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 170, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-icon i {
            color: #00d4aa;
            font-size: 1.2rem;
        }
        
        .status-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--neon-purple) 0%, var(--neon-blue) 100%);
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 20px rgba(138, 43, 226, 0.4),
                0 0 40px rgba(0, 212, 255, 0.2);
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(138, 43, 226, 0.6),
                0 0 60px rgba(0, 212, 255, 0.4);
        }
        
        .back-btn i {
            font-size: 1.1rem;
        }
        
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #00d4aa;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        
        .checkmark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #fff;
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px #00d4aa;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        
        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }
        
        @keyframes fill {
            100% { box-shadow: inset 0px 0px 0px 30px #00d4aa; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="neon-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    
    <main class="main-container">
        <div class="verify-card verified-card">
            <!-- Ícone -->
            <div class="verified-icon">
                <i class="fas fa-check-double"></i>
            </div>
            
            <!-- Título -->
            <h1 class="verified-title">Você já está verificado!</h1>
            
            <!-- Mensagem -->
            <p class="verified-message">
                Sua conta já foi verificada anteriormente.<br>
                Você pode voltar para o servidor e aproveitar todos os benefícios.
            </p>
            
            <!-- Status -->
            <div class="status-card">
                <div class="status-item">
                    <div class="status-icon">
                        <i class="fas fa-shield-check"></i>
                    </div>
                    <span class="status-text">Verificação ativa</span>
                </div>
                <div class="status-item">
                    <div class="status-icon">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <span class="status-text">Acesso ao servidor liberado</span>
                </div>
                <div class="status-item">
                    <div class="status-icon">
                        <i class="fas fa-gem"></i>
                    </div>
                    <span class="status-text">Benefícios exclusivos disponíveis</span>
                </div>
            </div>
            
            <!-- Botão voltar -->
            <a href="{{ server_url }}" class="back-btn" target="_blank">
                <i class="fab fa-discord"></i>
                <span>Voltar para o servidor</span>
            </a>
        </div>
        
        <footer class="footer">
            <p>Verificado com <span class="brand">IceX</span> Security</p>
        </footer>
    </main>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
