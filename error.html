<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - IceX Verify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icex-theme.css') }}">
    <style>
        .error-card {
            text-align: center;
            padding: 3rem 2rem;
            border-color: rgba(255, 71, 87, 0.3) !important;
        }
        
        .error-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b7a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: errorShake 0.5s ease-in-out;
            box-shadow: 
                0 0 30px rgba(255, 71, 87, 0.4),
                0 0 60px rgba(255, 71, 87, 0.2);
        }
        
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        
        .error-icon i {
            font-size: 3.5rem;
            color: #ffffff;
        }
        
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: rgba(255, 71, 87, 0.3);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255, 71, 87, 0.2);
        }
        
        .error-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff4757;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }
        
        .error-message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .error-details {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        .error-details i {
            color: #ff4757;
            margin-right: 0.5rem;
        }
        
        .error-details p {
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.6;
        }
        
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--ice-primary) 0%, var(--neon-blue) 100%);
            border: none;
            color: var(--bg-primary);
            box-shadow: 0 0 20px var(--ice-glow);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--ice-glow);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid var(--ice-primary);
            color: var(--ice-primary);
        }
        
        .btn-secondary:hover {
            background: var(--ice-primary);
            color: var(--bg-primary);
            box-shadow: 0 0 30px var(--ice-glow);
        }
        
        .glitch {
            position: relative;
            animation: glitch 2s infinite;
        }
        
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="neon-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    
    <main class="main-container">
        <div class="verify-card error-card">
            <!-- Ícone -->
            <div class="error-icon glitch">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            
            <!-- Código de erro -->
            <div class="error-code">!</div>
            
            <!-- Título -->
            <h1 class="error-title">{{ error or 'Ocorreu um erro' }}</h1>
            
            <!-- Mensagem -->
            <p class="error-message">
                {{ message or 'Algo inesperado aconteceu. Por favor, tente novamente.' }}
            </p>
            
            <!-- Detalhes -->
            <div class="error-details">
                <p>
                    <i class="fas fa-lightbulb"></i>
                    <strong>Dica:</strong> Se o problema persistir, limpe o cache do navegador 
                    ou entre em contato com a equipe de suporte.
                </p>
            </div>
            
            <!-- Botões -->
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">
                    <i class="fas fa-redo"></i>
                    <span>Tentar novamente</span>
                </a>
                <a href="{{ server_url or 'https://discord.com' }}" class="btn btn-secondary" target="_blank">
                    <i class="fab fa-discord"></i>
                    <span>Suporte Discord</span>
                </a>
            </div>
        </div>
        
        <footer class="footer">
            <p>Protegido por <span class="brand">IceX</span> Security</p>
        </footer>
    </main>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
