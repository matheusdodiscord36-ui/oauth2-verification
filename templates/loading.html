<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando... - IceX Verify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icex-theme.css') }}">
    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .snowflake-loader {
            width: 120px;
            height: 120px;
            position: relative;
            margin-bottom: 3rem;
        }

        .snowflake-loader i {
            font-size: 5rem;
            color: var(--ice-primary);
            animation: snowflakeSpin 2s linear infinite;
            text-shadow:
                0 0 20px var(--ice-glow),
                0 0 40px var(--ice-glow),
                0 0 60px var(--ice-glow);
        }

        @keyframes snowflakeSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            border: 2px solid transparent;
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: ringSpin 1.5s linear infinite;
        }

        .loading-ring:nth-child(2) {
            width: 180px;
            height: 180px;
            border-top-color: var(--neon-purple);
            animation-duration: 2s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--ice-primary);
            text-align: center;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px var(--ice-glow);
        }

        .loading-subtext {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: loadingDots 1.5s infinite;
        }

        @keyframes loadingDots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 2rem;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ice-primary), var(--neon-blue), var(--neon-purple));
            border-radius: 2px;
            animation: progressFill 3s ease-in-out infinite;
            box-shadow: 0 0 10px var(--ice-glow);
        }

        @keyframes progressFill {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 0%; margin-left: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="neon-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <main class="loading-container">
        <div class="snowflake-loader">
            <div class="loading-ring"></div>
            <div class="loading-ring"></div>
            <i class="fas fa-snowflake"></i>
        </div>

        <h1 class="loading-text">Verificando sua conta</h1>
        <p class="loading-subtext">
            Aguarde enquanto processamos sua verificação<span class="loading-dots"></span>
        </p>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
        const authUrl = "{{ auth_url }}";

        setTimeout(() => {
            window.location.href = authUrl;
        }, 800);

        setTimeout(() => {
            window.location.href = "/";
        }, 10000);
    </script>
</body>
</html>
